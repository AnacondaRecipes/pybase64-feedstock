{% set name = "pybase64" %}
{% set version = "1.5.1" %}
{% set sha256 = "aa924f7c2e90349d472d7d57c3680de8d222a32c2d3d07f922ab2f60516e478d" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  skip: true  # [py<39]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - pybase64=pybase64.__main__:main

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=77
  run:
    - python

test:
  imports:
    - pybase64
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/mayeut/pybase64/
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Fast Base64 encoding/decoding in Python
  description: |
    This project is a wrapper on libbase64. It aims to provide a fast base64 implementation for
    base64 encoding/decoding using the same interface as Python's base64 modern interface.
  doc_url: https://github.com/mayeut/pybase64/
  dev_url: https://github.com/mayeut/pybase64/

extra:
  recipe-maintainers:
    - njzjz
